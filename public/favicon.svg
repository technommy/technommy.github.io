<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark background rounded squircle -->
  <rect width="64" height="64" rx="14" fill="#0b0f19" stroke="#1f293d" stroke-width="2"/>
  <!-- Silicon die traces -->
  <path d="M 16 32 H 24 M 40 32 H 48 M 32 16 V 24 M 32 40 V 48" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Central core chip -->
  <rect x="22" y="22" width="20" height="20" rx="4" fill="url(#grad)" filter="url(#glow)"/>
  <!-- T logo glyph in white -->
  <path d="M 27 28 H 37 M 32 28 V 38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>